
<div class="p-3">
  <div class="mb-6">
    <div class="flex flex-wrap items-end gap-4">
      <div class="flex-1 min-w-80">
        <label class="block text-sm font-medium mb-2">Select Template</label>
        <div class="flex gap-3 items-end">
          <dx-select-box
            [items]="fundCombinations"
            displayExpr="TemplateName"
            valueExpr="Title"
            [(value)]="selectedFundCombinationTitle"
            [width]="320"
            [disabled]="isLoadingTemplates"
            [placeholder]="isLoadingTemplates ? 'Loading templates...' : 'Choose a template...'"
            [searchEnabled]="true"
            [showClearButton]="true"
            >
          </dx-select-box>
          <dx-button 
            text="Load Template"
            type="default"
            stylingMode="contained"
            icon="import"
            [width]="150"
            [height]="34"
            (onClick)="loadTemplate()"
            [disabled]="!selectedTemplate || isLoadingTemplates"
            hint="Load the selected template">
          </dx-button>
          <dx-button 
            text="Refresh"
            type="normal"
            stylingMode="outlined"
            icon="refresh"
            [width]="120"
            [height]="34"
            (onClick)="loadTemplatesFromAPI()"
            [disabled]="isLoadingTemplates"
            hint="Refresh templates from server">
          </dx-button>
        </div>
      </div>
   
    </div>
  </div>
  <div class="">
    <div style="display:flex; gap:8px; margin-bottom:8px; align-items:center">
      <dx-button text="Add Row" icon="plus" stylingMode="contained" (onClick)="addNewRow()"></dx-button>
      <dx-button text="Delete Selected" icon="trash" stylingMode="contained" type="danger" (onClick)="deleteSelectedRows()"></dx-button>
      <dx-button text="Clear All" icon="clear" stylingMode="outlined" (onClick)="clearRows()"></dx-button>
      <div style="flex:1"></div>
      <div *ngIf="expectedTotalNotional">Expected Total: {{ expectedTotalNotional | number:'1.2-2' }}</div>
    </div>

    <dx-data-grid #allocGrid
      [dataSource]="allocationData"
      [showBorders]="true"
      [rowAlternationEnabled]="true"
      [columnAutoWidth]="true"
      [hoverStateEnabled]="true"
      class="rounded-lg border border-gray-200 auto-height-grid"
      (onRowUpdated)="onRowUpdated($event)" (onRowInserted)="onRowInserted($event)" (onRowRemoved)="onRowRemoved($event)">
      
      <dxo-paging [enabled]="false"></dxo-paging>
      <dxo-editing mode="cell" [allowUpdating]="true"></dxo-editing>

      <dxi-column 
        dataField="account" 
        caption="Account" 
        [width]="140"
        alignment="left">
      </dxi-column>
        <dxi-column 
        dataField="notionalPercent" 
        caption="Notional %" 
         [width]="160"
        dataType="number"
        format="#,##0.00"
        alignment="right">
      </dxi-column>
      
      <dxi-column 
        dataField="notional" 
        caption="Notional" 
        dataType="number"
        format="#,##0.00"
        alignment="right">
      </dxi-column>

      <dxi-column 
        dataField="upfront" 
        caption="Upfront" 
        dataType="number" 
        format="#,##0.0000"
        alignment="right">
      </dxi-column>

      <dxi-column 
        caption="Actions" 
        [width]="140" 
        cellTemplate="actionCell"
        alignment="center">
      </dxi-column>

      <div *dxTemplate="let data of 'actionCell'">
        <div class="flex justify-center gap-1">
          <dx-button 
            icon="plus" 
            stylingMode="text" 
            type="success" 
            [height]="28" 
            (onClick)="addNewRow()"
            hint="Add Row"
            class="custom-icon-size"
            >
          </dx-button>
          <dx-button 
            icon="trash" 
            stylingMode="text" 
            type="danger" 
            [height]="28" 
            (onClick)="deleteSingleRow(data)"
            hint="Delete Row"
            class="custom-icon-size">
          </dx-button>
        </div>
      </div>
    </dx-data-grid>
  </div>
</div>
