<dx-button 
  stylingMode="contained" 
  text="Open CDS Stepper Form" 
  type="default" 
  (onClick)="openModal()" 
  [width]="220"
  icon="chart">
</dx-button>

<dx-popup 
  [visible]="showModal" 
  [showTitle]="true"
  [showCloseButton]="true"      
  [hideOnOutsideClick]="false"
  [width]="900" 
  [height]="'95vh'" 
  (onHiding)="closeModal()" 
  [dragEnabled]="true"
  [resizeEnabled]="true"
  [wrapperAttr]="{ class: 'zero-padding-overlay' }">

  <!-- Custom Popup Header (Stepper) -->
  <div *dxTemplate="let data of 'title'" class="!p-0">
    <div class="relative flex  border-b rounded-t-lg overflow-hidden">
      <!-- Close Button -->
      <button 
        class="absolute top-2 right-2 z-10 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors duration-200 text-gray-500 hover:text-gray-700"
        (click)="closeModal()"
        type="button">
        <i class="dx-icon-close text-lg text-[var(--secondary-text-color)] hover:text-black"></i>
      </button>
      
      <!-- Stepper Steps -->
      <ng-container *ngFor="let step of steps; let i = index">
        <div 
          class="flex-1 flex items-center justify-center border-r p-3 last:border-r-0 transition-all duration-300 gap-3"
          [ngClass]="{
            'bg-[var(--dx-color-primary)]':(i < selectedIndex && step.isValid) || i === selectedIndex,
            'bg-[var(--base-bg)]': i > selectedIndex
          }"
        >
          <div 
            class="w-6 h-6 flex items-center justify-center rounded-full font-semibold transition-all duration-300 flex-shrink-0"
            [ngClass]="{
              
              'bg-[var(--selected-item-color)] text-white':(i < selectedIndex && step.isValid) || i === selectedIndex,
              'bg-[var(--list-item-active-bg)] text-gray-400': i > selectedIndex
            }">
            {{ i + 1 }}
          </div>
          <span 
            class="text-sm font-medium"
            [ngClass]="{
              'text-[var(--text-color)]': (i < selectedIndex && step.isValid) || i === selectedIndex,
              'text-gray-400': i > selectedIndex
            }">
            {{ step.label }}
          </span>
        </div>
      </ng-container>
    </div>
  </div>

  <!-- Popup Body -->
   <div class="flex flex-col h-full justify-between">
     <dx-scroll-view >
       <div class="px-2">
         <!-- Keep both step components in DOM and toggle visibility so they keep state -->
         <div>
           <!-- Step 1 (CDS Options) -->
           <div [hidden]="selectedIndex !== 0">
             <app-cds-options #cdsOptionsRef (navigateToNext)="goToNext()"></app-cds-options>
           </div>

           <!-- Step 2 (Allocation) -->
           <div [hidden]="selectedIndex !== 1">
             <allocation-form 
               #allocationRef 
               (navigateToPrevious)="goToPrevious()" 
               (finishProcess)="onFinish()">
             </allocation-form>
           </div>
         </div>
       </div>
     </dx-scroll-view>
   
       <div class="border-t  px-6 py-4">
       <div class="flex justify-between items-center">
         <div class="flex-1">
           <dx-button
             *ngIf="selectedIndex > 0"
             text="Previous"
             type="normal"
             stylingMode="outlined"
             icon="chevronleft"
             (onClick)="goToPrevious()"
             [width]="130">
           </dx-button>
         </div>
   
         <div class="flex-1 flex justify-end">
           <dx-button
             [text]="getNextButtonText()"
             type="default"
             stylingMode="contained"
             [icon]="selectedIndex === steps.length - 1 ? 'check' : 'chevronright'"
             (onClick)="onNextButtonClick()"
             [disabled]="isNextButtonDisabled()"
             [width]="120">
           </dx-button>
         </div>
       </div>
     </div>

   </div>
  


</dx-popup>
